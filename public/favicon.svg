<svg width="64" height="64" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="qrg-main" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="qrg-cap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF" />
      <stop offset="60%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="qrg-lightning" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
  </defs>

  <rect width="120" height="120" rx="26" fill="#FFFFFF" />

  <!-- Finder 1: Top-Left -->
  <rect x="12" y="12" width="28" height="28" rx="8" fill="none" stroke="url(#qrg-main)" stroke-width="5" />
  <rect x="20.5" y="20.5" width="11" height="11" rx="3.5" fill="#10B981" />

  <!-- Finder 2: Bottom-Left -->
  <rect x="12" y="80" width="28" height="28" rx="8" fill="none" stroke="url(#qrg-main)" stroke-width="5" />
  <rect x="20.5" y="88.5" width="11" height="11" rx="3.5" fill="#10B981" />

  <!-- Finder 3: Bottom-Right & Creative Nib -->
  <rect x="80" y="80" width="26" height="26" rx="7" fill="none" stroke="url(#qrg-main)" stroke-width="5" />
  <circle cx="93" cy="93" r="4.5" fill="#10B981" />
  <path d="M 103,74 C 103,88 97,103 95,110 C 98,110 105,103 108,93 C 111,84 109,76 103,74 Z" fill="url(#qrg-main)" />

