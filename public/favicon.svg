  <!-- Organic QR Modules & Dots -->
  <circle cx="14" cy="50" r="3.5" fill="#4F46E5" />
  <circle cx="14" cy="65" r="3.5" fill="#4F46E5" />
  <circle cx="25" cy="57" r="4" fill="#3B82F6" />
